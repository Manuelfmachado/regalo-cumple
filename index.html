<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#120a22">
<meta name="description" content="Un regalito hecho a mano: toca la pantalla y ve descubriendo lo que guarde para ti.">
<meta property="og:title" content="Guardé algo para ti ✨">
<meta property="og:description" content="Toca la pantalla y ve descubriendo lo que guarde para ti.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://manuelfmachado.github.io/regalo-cumple/">
<meta property="og:image" content="https://manuelfmachado.github.io/regalo-cumple/preview.png">
<title>Guardé algo para ti ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#fbf2fb;
  --gold:#ffd9a8;
  --serif:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --sans:"Jost", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --ease:cubic-bezier(.22,.61,.36,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0;padding:0}
body{
  font-family:var(--sans);color:var(--ink);background:#0b0514;overflow:hidden;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overscroll-behavior:none;
}
#bg{position:fixed;inset:0;z-index:0;background:radial-gradient(130% 90% at 50% -20%, #5a2f7d 0%, #371b55 30%, #1d0f30 58%, #0b0514 100%)}
#bg::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 50% at 50% 112%, rgba(255,140,170,.20), transparent 70%)}
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;display:block;border-radius:50%;opacity:.6;will-change:transform}
.aurora i:nth-child(1){width:78vmax;height:78vmax;left:-34vmax;top:-28vmax;background:radial-gradient(circle,rgba(255,120,170,.42),rgba(255,120,170,.10) 45%,transparent 68%);animation:fl1 24s ease-in-out infinite alternate}
.aurora i:nth-child(2){width:70vmax;height:70vmax;right:-30vmax;top:2vmax;background:radial-gradient(circle,rgba(142,110,255,.40),rgba(142,110,255,.09) 45%,transparent 68%);animation:fl2 30s ease-in-out infinite alternate}
.aurora i:nth-child(3){width:66vmax;height:66vmax;left:2vmax;bottom:-34vmax;background:radial-gradient(circle,rgba(255,190,120,.26),rgba(255,190,120,.06) 45%,transparent 68%);animation:fl3 27s ease-in-out infinite alternate}
@keyframes fl1{to{transform:translate3d(6vmax,4vmax,0) scale(1.08)}}
@keyframes fl2{to{transform:translate3d(-8vmax,6vmax,0) scale(1.12)}}
@keyframes fl3{to{transform:translate3d(5vmax,-6vmax,0) scale(1.06)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.vignette{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 100% at 50% 40%, transparent 38%, rgba(6,3,12,.6) 100%)}
#app{position:fixed;inset:0;z-index:4}

.scene{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(26px + env(safe-area-inset-top,0px)) 20px calc(26px + env(safe-area-inset-bottom,0px));
  opacity:0;visibility:hidden;pointer-events:none;transform:scale(1.015);
  transition:opacity .75s var(--ease), transform .75s var(--ease), visibility .75s;
}
.scene.on{opacity:1;visibility:visible;pointer-events:auto;transform:none}

/* ---------- portada ---------- */
#intro{text-align:center}
.eyebrow{font-size:.64rem;letter-spacing:.44em;text-transform:uppercase;color:rgba(255,214,170,.72);margin:0 0 30px;padding-left:.44em}
.halo{position:relative;width:148px;height:148px;display:grid;place-items:center;margin-bottom:26px}
.halo .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(255,190,160,.22);animation:ripple 4.6s var(--ease) infinite}
.halo .ring:nth-child(2){animation-delay:1.5s}
.halo .ring:nth-child(3){animation-delay:3s}
@keyframes ripple{0%{transform:scale(.5);opacity:0}20%{opacity:.8}100%{transform:scale(1.5);opacity:0}}
.heart{width:94px;filter:drop-shadow(0 0 30px rgba(255,140,175,.6));animation:beat 2.9s var(--ease) infinite}
.heart svg{display:block;width:100%;height:auto;overflow:visible}
@keyframes beat{0%,100%{transform:scale(1)}10%{transform:scale(1.09)}20%{transform:scale(1)}30%{transform:scale(1.05)}42%{transform:scale(1)}}
.intro-title{
  font-family:var(--serif);font-weight:300;font-size:clamp(2.55rem,11.5vw,4.3rem);line-height:1.02;margin:0 0 26px;
  letter-spacing:-.015em;text-wrap:balance;
}
.intro-title em{font-style:italic;background:linear-gradient(100deg,#ffe6c4,#ffb6c8 58%,#e6c3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.cue{display:inline-flex;align-items:center;gap:11px;font-size:.68rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,240,250,.6);animation:pulse 2.8s ease-in-out infinite;padding-left:.34em}
.cue i{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(255,200,140,.9)}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* ---------- recorrido ---------- */
#journey{justify-content:space-between;gap:10px}
.jtop{width:100%;max-width:560px;display:flex;justify-content:center;padding-top:4px;flex:0 0 auto}
.dots{display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;max-width:320px}
.dot{font-size:11px;line-height:1;color:rgba(255,255,255,.15);transition:all .55s var(--ease);transform:translateZ(0)}
.dot.done{color:rgba(255,190,215,.55)}
.dot.on{color:#ffb3c8;text-shadow:0 0 12px rgba(255,120,170,.95);transform:scale(1.6)}
#stage{flex:1 1 auto;width:100%;max-width:600px;display:flex;align-items:center;justify-content:center;min-height:0;overflow-y:auto;overflow-x:hidden;padding:14px 0;scrollbar-width:none}
#stage::-webkit-scrollbar{display:none}
.jbottom{height:42px;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.tapnote{font-size:.6rem;letter-spacing:.34em;text-transform:uppercase;color:rgba(255,235,245,.4);margin:0;padding-left:.34em;transition:opacity .5s var(--ease);animation:pulse 3s ease-in-out infinite}
.tapnote.off{opacity:0;animation:none}

.card{
  position:relative;width:100%;max-width:560px;margin:auto;
  padding:clamp(26px,7vw,42px) clamp(20px,6vw,38px) clamp(22px,6vw,34px);
  border-radius:26px;text-align:center;
  background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.028) 55%,rgba(255,255,255,.012));
  border:1px solid rgba(255,214,170,.16);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.1), 0 0 100px -50px rgba(255,150,190,.7);
}
.cardtop{display:flex;align-items:center;justify-content:space-between;gap:12px}
.num{font-size:.6rem;letter-spacing:.3em;color:rgba(255,214,170,.55)}
.spark{font-size:11px;line-height:1;color:rgba(255,180,205,.75);flex:0 0 auto;filter:drop-shadow(0 0 5px rgba(255,140,180,.5))}
.msg{font-family:var(--serif);font-size:clamp(1.4rem,5.4vw,1.95rem);line-height:1.44;font-weight:400;margin:20px 0 0;color:#fdf4fb;text-wrap:balance}
.orn{margin-top:24px;display:flex;align-items:center;justify-content:center;gap:12px}
.orn::before,.orn::after{content:"";height:1px;width:32px;background:linear-gradient(90deg,transparent,rgba(255,214,170,.45),transparent)}
.orn span{font-size:11px;color:rgba(255,180,205,.85);filter:drop-shadow(0 0 6px rgba(255,140,180,.55))}

@keyframes cardIn{from{opacity:0;transform:translateY(24px) scale(.985)}to{opacity:1;transform:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-18px) scale(.99)}}
.card.in{animation:cardIn .9s var(--ease) both}
.card.out{animation:cardOut .42s var(--ease) both}
.card.glow{box-shadow:0 40px 90px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.12), 0 0 120px -30px rgba(255,170,200,.85)}

/* tarjeta sostener */
.holdzone{margin-top:26px;display:flex;flex-direction:column;align-items:center;gap:14px}
.hbtn{
  position:relative;width:96px;height:96px;border-radius:50%;padding:0;cursor:pointer;
  border:1px solid rgba(255,214,170,.28);
  background:radial-gradient(circle at 50% 36%,rgba(255,170,200,.20),rgba(255,170,200,.02) 70%);
  display:grid;place-items:center;transition:transform .25s var(--ease), box-shadow .5s var(--ease);
  box-shadow:0 0 44px -14px rgba(255,150,190,.55);
}
.hbtn:active{transform:scale(.95)}
.hbtn .hp{font-size:30px;line-height:1;color:#ffc2d3;filter:drop-shadow(0 0 10px rgba(255,120,160,.85));transition:transform .35s var(--ease)}
.hbtn.done{box-shadow:0 0 70px -6px rgba(255,160,190,.95)}
.hbtn.done .hp{transform:scale(1.2)}
.hbtn.ring-me{animation:ringme .6s var(--ease)}
@keyframes ringme{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hbtn svg.ring-svg{position:absolute;inset:-5px;width:calc(100% + 10px);height:calc(100% + 10px);transform:rotate(-90deg)}
.hbtn .track{fill:none;stroke:rgba(255,255,255,.10);stroke-width:2}
.hbtn .bar{fill:none;stroke:#ffd9a8;stroke-width:2.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(255,200,140,.85))}
.holdlabel{font-size:.6rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,235,245,.5);margin:0;padding-left:.3em;text-align:center}
.secret{max-height:0;opacity:0;overflow:hidden;transition:max-height 1s var(--ease),opacity .9s var(--ease),margin .9s var(--ease);margin-top:0}
.secret.show{max-height:320px;opacity:1;margin-top:22px}
.secret p{font-family:var(--serif);font-style:italic;font-size:clamp(1.15rem,4.4vw,1.42rem);line-height:1.5;color:#ffe1c0;margin:0}

/* foto */
.photo{margin-top:22px;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.2)}
.photo img{display:block;width:100%;max-height:50vh;object-fit:cover}
.caption{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,235,245,.45);margin:14px 0 0}

/* ---------- final ---------- */
#finale{overflow-y:auto;justify-content:flex-start;padding-top:calc(58px + env(safe-area-inset-top,0px));padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
#finale::-webkit-scrollbar{display:none}
.final-inner{width:100%;max-width:620px;margin:auto;text-align:center;display:flex;flex-direction:column;align-items:center}
.final-title{font-family:var(--serif);font-weight:300;font-size:clamp(2.7rem,12.5vw,5rem);line-height:.96;margin:0;letter-spacing:-.02em}
.final-title em{display:block;font-style:italic;background:linear-gradient(100deg,#ffe6c4,#ffb6c8 55%,#e3c3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.final-name{font-family:var(--serif);font-size:clamp(1.25rem,4.8vw,1.7rem);color:#ffd9a8;margin:16px 0 0;letter-spacing:.06em;min-height:1px}
.divider{width:120px;height:1px;margin:32px 0 30px;background:linear-gradient(90deg,transparent,rgba(255,214,170,.55),transparent)}
.letter{
  width:100%;text-align:left;padding:clamp(24px,6vw,38px);border-radius:22px;
  background:linear-gradient(165deg,rgba(40,22,62,.88),rgba(22,11,38,.82));
  border:1px solid rgba(255,214,170,.14);
  box-shadow:0 30px 80px -40px rgba(0,0,0,.9), inset 0 1px 0 rgba(255,255,255,.07);
  opacity:0;transform:translateY(18px);transition:opacity 1.1s var(--ease), transform 1.1s var(--ease);
}
.lit .letter{opacity:1;transform:none}
.letter p{font-family:var(--serif);font-size:clamp(1.12rem,4vw,1.32rem);line-height:1.62;color:rgba(253,244,251,.93);margin:0 0 18px;white-space:pre-line}
.letter p:last-child{margin-bottom:0}
.sign{font-style:italic;color:#ffd9a8;text-align:right;font-size:1.16rem;margin-top:26px}
.video{width:100%;margin-top:28px;display:none}
.video.show{display:block}
.vwrap{position:relative;width:100%;aspect-ratio:16/9;border-radius:18px;overflow:hidden;border:1px solid rgba(255,214,170,.18);box-shadow:0 24px 60px -30px rgba(0,0,0,.9);background:rgba(0,0,0,.35)}
.vwrap.vertical{max-width:320px;margin:0 auto;aspect-ratio:9/16}
.vwrap iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vlink{margin:12px 0 0;text-align:center;font-size:.6rem;letter-spacing:.22em;text-transform:uppercase}
.vlink a{color:rgba(255,214,170,.72);text-decoration:none;border-bottom:1px solid rgba(255,214,170,.25);padding-bottom:2px}
.ghost{
  margin-top:32px;background:transparent;border:1px solid rgba(255,214,170,.32);color:rgba(255,240,250,.82);
  padding:12px 24px;border-radius:999px;font-family:var(--sans);font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;
  cursor:pointer;transition:all .35s var(--ease);padding-left:calc(24px + .32em);
}
.ghost:hover{background:rgba(255,214,170,.1);border-color:rgba(255,214,170,.6)}
.footer-note{margin:26px 0 0;font-size:.56rem;letter-spacing:.3em;text-transform:uppercase;color:rgba(255,240,250,.25);padding-left:.3em}

/* ---------- sonido ---------- */
.sound{
  position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:30;
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.12);color:rgba(255,240,250,.6);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:all .3s;
}
.sound:hover{background:rgba(255,255,255,.1);color:rgba(255,240,250,.9)}
.sound svg{width:15px;height:15px}

@media (max-height:680px){
  .halo{width:118px;height:118px;margin-bottom:18px}
  .heart{width:74px}
  .eyebrow{margin-bottom:20px}
  .intro-title{margin-bottom:20px}
  .msg{margin-top:14px}
  .orn{margin-top:18px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.18s !important}
}
</style>
</head>
<body>
<div id="bg"></div>
<div class="aurora"><i></i><i></i><i></i></div>
<canvas id="fx"></canvas>
<div class="vignette"></div>

<button id="sound" class="sound" type="button" aria-label="Activar o desactivar el sonido" title="Sonido">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z"></path>
    <path class="waves" d="M15.6 8.6a5 5 0 0 1 0 6.8M18.2 6.2a8.4 8.4 0 0 1 0 11.6"></path>
    <path class="slash" d="M16 8.5l5 7M21 8.5l-5 7" style="display:none"></path>
  </svg>
</button>

<main id="app">

  <section id="intro" class="scene on" aria-label="Portada">
    <p class="eyebrow">para ti</p>
    <div class="halo">
      <span class="ring"></span><span class="ring"></span><span class="ring"></span>
      <div class="heart">
        <svg viewBox="0 0 100 90" aria-hidden="true">
          <defs>
            <linearGradient id="hg" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ffe3c2"></stop>
              <stop offset=".45" stop-color="#ffb3c8"></stop>
              <stop offset="1" stop-color="#e3b8ff"></stop>
            </linearGradient>
          </defs>
          <path fill="url(#hg)" d="M50 84C20 62 4 44 4 27 4 12 15 2 28 2c10 0 18 6 22 14C54 8 62 2 72 2c13 0 24 10 24 25 0 17-16 35-46 57z"></path>
        </svg>
      </div>
    </div>
    <h1 class="intro-title">Guardé algo<br><em>para ti</em></h1>
    <div class="cue"><i></i>toca la pantalla</div>
  </section>

  <section id="journey" class="scene" aria-label="Mensajes">
    <div class="jtop"><div class="dots" id="dots"></div></div>
    <div id="stage"></div>
    <div class="jbottom"><p class="tapnote" id="tapnote">toca para seguir</p></div>
  </section>

  <section id="finale" class="scene" aria-label="Feliz cumpleaños">
    <div class="final-inner">
      <p class="eyebrow" style="margin-bottom:22px">hoy es tu día</p>
      <h2 class="final-title">Feliz<em>cumpleaños</em></h2>
      <p class="final-name" id="finalName"></p>
      <div class="divider"></div>
      <div class="letter">
        <p id="letterText"></p>
        <p class="sign" id="signText"></p>
      </div>
      <div class="video" id="videoBox">
        <div class="vwrap"><iframe id="videoFrame" title="Un video para ti" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>
        <p class="vlink"><a id="videoLink" href="#" target="_blank" rel="noopener">si no carga, ábrelo en YouTube ↗</a></p>
      </div>
      <button class="ghost" id="again" type="button">volver a leer</button>
      <p class="footer-note">hecho con amor por Maño</p>
    </div>
  </section>

</main>

<script>
(function(){
  'use strict';

  /* ============================================================
     PERSONALIZA AQUI  (lo unico que necesitas tocar)
     ============================================================ */

  var CONFIG = {
    // Su nombre (aparece en la pantalla final)
    nombre: "Marianita",

    // Los 5 mensajes de las tarjetas
    mensajes: [
      "Mi Amor, eres mi dulce niña, mi ingeniera peshosha.",
      "Hoy todo el internet puede ver esta linda dedicatoria. Si compartes el link, todos sabrán que un pedacito de internet es exclusivo para ti.",
      "Sabes que en ti veo cualidades ingeniosas y te admiro por eso. Dios te obsequió eso.",
      "Mi corazón es tuyo también y tú estás en mis oraciones. Deseo que la intimidad de Cristo reine en tu vida.",
      "Con mi tierno y dulce amor te felicito en tu día. Feliz cumpleaños, Marianita."
    ],

    // La carta del final
    carta: "Mi Marianita:\n\nHoy quería darte algo que no se compra ni se envuelve: un pedacito de internet hecho solo para ti, donde cada palabra te la digo sin apuro.\n\nGracias por ser mi dulce niña, mi ingeniera peshosha, mi compañía bonita. Que Dios siga bendiciendo tu vida y que este año te devuelva todo lo bueno que das.\n\nFeliz cumpleaños, mi amor.",

    firma: "Con todo mi cariño, Maño",

    // Video opcional al final: pega aquí el link de YouTube o de Google Drive.
    video: "https://youtube.com/shorts/Mv6oZ-6gPCo",

    // Foto opcional: guarda la imagen al lado de este archivo y pon aquí su nombre.
    foto: "",
    fotoCaption: "",

    sonido: true
  };

  /* ============================================================
     A partir de aquí, la máquina. (No hace falta tocar nada)
     ============================================================ */

  var stage    = document.getElementById('stage');
  var intro    = document.getElementById('intro');
  var journey  = document.getElementById('journey');
  var finale   = document.getElementById('finale');
  var dotsEl   = document.getElementById('dots');
  var tapnote  = document.getElementById('tapnote');
  var finalName= document.getElementById('finalName');
  var letterEl = document.getElementById('letterText');
  var signEl   = document.getElementById('signText');
  var soundBtn = document.getElementById('sound');
  var againBtn = document.getElementById('again');

  var SCENES = buildScenes();
  var state = { i:-1, locked:true, inFinale:false, holdDone:false };

  /* ---------- construccion de escenas ---------- */
  function buildScenes(){
    var out = [];
    var msgs = CONFIG.mensajes || [];
    for (var i = 0; i < msgs.length; i++){
      out.push({ kind:'msg', texto: msgs[i] });
    }
    if (CONFIG.foto) out.push({ kind:'photo', src: CONFIG.foto, caption: CONFIG.fotoCaption });
    return out;
  }

  function pad(n){ return (n < 10 ? '0' : '') + n; }

  function dotbar(total){
    dotsEl.innerHTML = '';
    for (var i = 0; i < total; i++){
      var d = document.createElement('span');
      d.className = 'dot';
      d.textContent = '\u2665';
      dotsEl.appendChild(d);
    }
  }

  function paintDots(active){
    var ds = dotsEl.children;
    for (var i = 0; i < ds.length; i++){
      ds[i].className = 'dot' + (i < active ? ' done' : '') + (i === active ? ' on' : '');
    }
  }

  /* ---------- render de una tarjeta ---------- */
  function render(s, i){
    var card = document.createElement('article');
    card.className = 'card';

    var top = document.createElement('div');
    top.className = 'cardtop';
    var num = document.createElement('span');
    num.className = 'num';
    num.textContent = pad(i + 1) + ' / ' + pad(SCENES.length);
    var spark = document.createElement('span');
    spark.className = 'spark';
    spark.textContent = '\u2665';
    top.appendChild(num);
    top.appendChild(spark);
    card.appendChild(top);

    if (s.kind === 'msg'){
      var p = document.createElement('p');
      p.className = 'msg';
      p.textContent = s.texto;
      card.appendChild(p);
    }

    if (s.kind === 'hold'){
      var hp = document.createElement('p');
      hp.className = 'msg';
      hp.textContent = s.texto;
      card.appendChild(hp);

      var zone = document.createElement('div');
      zone.className = 'holdzone';

      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'hbtn';
      btn.setAttribute('aria-label', 'Mantén presionado para revelar');
      btn.innerHTML =
        '<svg class="ring-svg" viewBox="0 0 100 100">' +
          '<circle class="track" cx="50" cy="50" r="47" pathLength="1"></circle>' +
          '<circle class="bar" cx="50" cy="50" r="47" pathLength="1"></circle>' +
        '</svg><span class="hp">&#9829;</span>';

      var label = document.createElement('p');
      label.className = 'holdlabel';
      label.textContent = 'mantén presionado';

      zone.appendChild(btn);
      zone.appendChild(label);
      card.appendChild(zone);

      var secret = document.createElement('div');
      secret.className = 'secret';
      var sp = document.createElement('p');
      sp.textContent = s.secreto;
      secret.appendChild(sp);
      card.appendChild(secret);

      bindHold(btn, label, secret, card);
    }

    if (s.kind === 'photo'){
      var wrap = document.createElement('div');
      wrap.className = 'photo';
      var img = document.createElement('img');
      img.src = s.src;
      img.alt = '';
      img.onerror = function(){ wrap.style.display = 'none'; };
      wrap.appendChild(img);
      card.appendChild(wrap);
      if (s.caption){
        var cap = document.createElement('p');
        cap.className = 'caption';
        cap.textContent = s.caption;
        card.appendChild(cap);
      }
    }

    var orn = document.createElement('div');
    orn.className = 'orn';
    var st = document.createElement('span');
    st.textContent = '♥';
    orn.appendChild(st);
    card.appendChild(orn);

    stage.innerHTML = '';
    stage.appendChild(card);
    requestAnimationFrame(function(){
      requestAnimationFrame(function(){ card.classList.add('in'); });
    });
  }

  /* ---------- sostener ---------- */
  function bindHold(btn, label, secret, card){
    var bar = btn.querySelector('.bar');
    var done = false, raf = 0, t0 = 0, DUR = 1250;

    function tick(){
      var p = Math.min(1, (performance.now() - t0) / DUR);
      bar.style.strokeDashoffset = String(1 - p);
      if (p >= 1){ finish(); return; }
      raf = requestAnimationFrame(tick);
    }

    function start(e){
      if (done) return;
      if (e && e.cancelable) e.preventDefault();
      try { if (btn.setPointerCapture) btn.setPointerCapture(e.pointerId); } catch (err){}
      t0 = performance.now();
      cancelAnimationFrame(raf);
      tick();
    }

    function stop(){
      cancelAnimationFrame(raf);
      if (!done){
        bar.style.strokeDashoffset = '1';
      }
    }

    function finish(){
      cancelAnimationFrame(raf);
      done = true;
      state.holdDone = true;
      bar.style.strokeDashoffset = '0';
      btn.classList.add('done');
      card.classList.add('glow');
      secret.classList.add('show');
      label.textContent = 'listo ✦';
      tapnote.textContent = 'toca para seguir';
      bell(659.25, .05);
      setTimeout(function(){ bell(880, .045); }, 160);
      setTimeout(function(){ bell(1174.66, .03); }, 320);
    }

    btn.addEventListener('pointerdown', start);
    btn.addEventListener('pointerup', stop);
    btn.addEventListener('pointercancel', stop);
    btn.addEventListener('pointerleave', stop);
    btn.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  }

  function nudge(){
    var b = stage.querySelector('.hbtn');
    var l = stage.querySelector('.holdlabel');
    if (b){ b.classList.remove('ring-me'); void b.offsetWidth; b.classList.add('ring-me'); }
    if (l){ l.style.color = 'rgba(255,214,170,.9)'; setTimeout(function(){ l.style.color = ''; }, 900); }
  }

  /* ---------- navegacion ---------- */
  function go(i){
    state.locked = true;
    state.i = i;
    state.holdDone = false;
    tapnote.classList.remove('off');

    var old = stage.querySelector('.card');
    var delay = 60;

    if (old){
      old.classList.remove('in');
      old.classList.add('out');
      delay = 300;
      setTimeout(function(){
        if (old && old.parentNode) old.parentNode.removeChild(old);
      }, 460);
    }

    if (i >= SCENES.length){
      setTimeout(showFinale, delay + 120);
      return;
    }

    paintDots(i);

    setTimeout(function(){
      render(SCENES[i], i);
      state.locked = false;
      var note = SCENES[i].kind === 'hold' ? 'mantén presionado el corazón' : 'toca para seguir';
      tapnote.textContent = note;
      if (SCENES[i].kind === 'hold') tapnote.classList.add('off');
      tone(i);
    }, delay);
  }

  function advance(){
    if (state.locked) return;
    if (state.inFinale) return;
    var cur = SCENES[state.i];
    if (cur && cur.kind === 'hold' && !state.holdDone){ nudge(); return; }
    go(state.i + 1);
  }

  function startJourney(at){
    if (state.inFinale) return;
    intro.classList.remove('on');
    journey.classList.add('on');
    dotbar(SCENES.length);
    state.started = true;
    setTimeout(function(){
      state.locked = false;
      go(typeof at === 'number' ? at : 0);
    }, 260);
  }

  /* ---------- final ---------- */
  function showFinale(){
    state.inFinale = true;
    state.locked = true;
    intro.classList.remove('on');
    journey.classList.remove('on');
    finale.classList.add('on');

    finalName.textContent = CONFIG.nombre ? '· ' + CONFIG.nombre + ' ·' : '';
    letterEl.textContent = CONFIG.carta;
    signEl.textContent = CONFIG.firma;

    if (CONFIG.video){
      var box = document.getElementById('videoBox');
      var fr = document.getElementById('videoFrame');
      var wrapEl = box ? box.querySelector('.vwrap') : null;
      var reveal = function(){
        if (!box || !fr) return;
        fr.src = embedUrl(CONFIG.video);
        var lk = document.getElementById('videoLink');
        if (lk) lk.href = CONFIG.video;
        if (wrapEl && /shorts\//.test(CONFIG.video)) wrapEl.classList.add('vertical');
        box.classList.add('show');
      };
      var vid = (CONFIG.video.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/) || [])[1];
      if (vid){
        var check = 'https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + vid) + '&format=json';
        fetch(check, { mode: 'cors' })
          .then(function(r){
            if (r.ok){ reveal(); }
            else if (box){ box.style.display = 'none'; }
          })
          .catch(function(){ reveal(); });
      } else {
        reveal();
      }
    }

    setTimeout(function(){ finale.classList.add('lit'); }, 420);
    setTimeout(function(){ rain(46); }, 260);
    setTimeout(function(){ rain(26); }, 1100);
    finaleChord();
  }

  function embedUrl(u){
    if (!u) return '';
    var yt = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{6,})/);
    if (yt) return 'https://www.youtube.com/embed/' + yt[1];
    var dr = u.match(/drive\.google\.com\/file\/d\/([^\/]+)/);
    if (dr) return 'https://drive.google.com/file/d/' + dr[1] + '/preview';
    return u;
  }

  function restart(){
    finale.classList.remove('on', 'lit');
    stage.innerHTML = '';
    state.i = -1;
    state.inFinale = false;
    state.locked = true;
    setTimeout(function(){
      intro.classList.add('on');
      setTimeout(function(){ journey.classList.remove('on'); }, 500);
    }, 300);
  }

  /* ---------- interaccion ---------- */
  var down = null;

  intro.addEventListener('pointerdown', function(e){
    down = { x: e.clientX, y: e.clientY, t: Date.now() };
  });
  intro.addEventListener('pointerup', function(e){
    if (!down) return;
    var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y);
    var quick = Date.now() - down.t < 1200;
    down = null;
    if (moved > 20 || !quick) return;
    unlockAudio();
    burst(e.clientX, e.clientY, 9);
    startJourney(0);
  });

  journey.addEventListener('pointerdown', function(e){
    down = { x: e.clientX, y: e.clientY, t: Date.now(), target: e.target };
  });
  journey.addEventListener('pointerup', function(e){
    if (!down) return;
    var d = down; down = null;
    var moved = Math.hypot(e.clientX - d.x, e.clientY - d.y);
    var quick = Date.now() - d.t < 1200;
    if (moved > 16 || !quick) return;
    if (d.target && d.target.closest && d.target.closest('button')) return;
    if (state.inFinale) return;
    burst(e.clientX, e.clientY, 6);
    advance();
  });

  finale.addEventListener('pointerup', function(e){
    var t = e.target;
    if (t && t.closest && t.closest('button')) return;
    burst(e.clientX, e.clientY, 10);
  });

  againBtn.addEventListener('click', function(e){
    e.stopPropagation();
    restart();
  });

  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'Enter' || e.key === 'ArrowRight'){
      e.preventDefault();
      if (intro.classList.contains('on')) { unlockAudio(); startJourney(0); }
      else if (journey.classList.contains('on')) advance();
    }
  });

  /* ---------- sonido ---------- */
  var AC = window.AudioContext || window.webkitAudioContext;
  var actx = null;
  var muted = !CONFIG.sonido;

  function unlockAudio(){
    if (!AC) return;
    if (!actx){
      try { actx = new AC(); } catch (e){ actx = null; return; }
    }
    if (actx.state === 'suspended'){ actx.resume(); }
  }

  function bell(freq, vol){
    if (muted || !actx) return;
    var t = actx.currentTime;
    var out = actx.createGain();
    out.gain.value = vol || 0.06;
    out.connect(actx.destination);

    var o1 = actx.createOscillator();
    o1.type = 'sine';
    o1.frequency.value = freq;

    var o2 = actx.createOscillator();
    o2.type = 'triangle';
    o2.frequency.value = freq * 2.001;

    var g1 = actx.createGain();
    g1.gain.setValueAtTime(0.0001, t);
    g1.gain.exponentialRampToValueAtTime(1, t + 0.015);
    g1.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);

    var g2 = actx.createGain();
    g2.gain.setValueAtTime(0.0001, t);
    g2.gain.exponentialRampToValueAtTime(0.24, t + 0.01);
    g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);

    o1.connect(g1); g1.connect(out);
    o2.connect(g2); g2.connect(out);
    o1.start(t); o2.start(t);
    o1.stop(t + 2); o2.stop(t + 1);
  }

  var PENTA = [392, 440, 523.25, 587.33, 659.25, 783.99, 880, 987.77, 1174.66];
  function tone(i){ bell(PENTA[i % PENTA.length], 0.055); }
  function finaleChord(){
    bell(523.25, 0.05);
    setTimeout(function(){ bell(659.25, 0.045); }, 130);
    setTimeout(function(){ bell(783.99, 0.04); }, 260);
    setTimeout(function(){ bell(1046.5, 0.035); }, 420);
  }

  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    muted = !muted;
    unlockAudio();
    soundBtn.style.opacity = muted ? '.45' : '1';
    paintSound();
    if (!muted) bell(880, 0.05);
  });

  /* ---------- polvo de estrellas ---------- */
  var cv = document.getElementById('fx');
  var ctx = cv.getContext('2d');
  var W = 0, H = 0, DPR = 1;
  var parts = [];
  var reduced = false;
  try { reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e){}
  var sprite = makeSprite();

  function makeSprite(){
    var c = document.createElement('canvas');
    c.width = c.height = 64;
    var g2 = c.getContext('2d');
    var grad = g2.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,244,228,1)');
    grad.addColorStop(0.22, 'rgba(255,214,180,.9)');
    grad.addColorStop(0.55, 'rgba(255,180,200,.28)');
    grad.addColorStop(1, 'rgba(255,170,200,0)');
    g2.fillStyle = grad;
    g2.fillRect(0, 0, 64, 64);
    return c;
  }

  function resize(){
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  var COLORS = ['rgba(255,220,180,', 'rgba(255,180,205,', 'rgba(214,185,255,', 'rgba(255,246,235,'];

  function ambient(){
    if (Math.random() < 0.52){
      parts.push({
        t: 'heart',
        x: Math.random() * W,
        y: H + 16,
        vx: (Math.random() - 0.5) * 0.18,
        vy: -(0.10 + Math.random() * 0.28),
        g: 0,
        r: 3.2 + Math.random() * 4.6,
        a: 0.20 + Math.random() * 0.38,
        c: 'rgba(255,170,200,',
        rot: (Math.random() - 0.5) * 0.5,
        vr: (Math.random() - 0.5) * 0.012,
        life: 0,
        max: 1100 + Math.random() * 1100,
        wob: Math.random() * 6.28,
        ws: 0.0006 + Math.random() * 0.0014
      });
      return;
    }
    var c = COLORS[Math.floor(Math.random() * COLORS.length)];
    parts.push({
      t: 'dot',
      x: Math.random() * W,
      y: H + 12,
      vx: (Math.random() - 0.5) * 0.16,
      vy: -(0.10 + Math.random() * 0.34),
      r: 2 + Math.random() * 5,
      a: 0.18 + Math.random() * 0.45,
      c: c,
      life: 0,
      max: 700 + Math.random() * 700,
      wob: Math.random() * 6.28,
      ws: 0.0006 + Math.random() * 0.0012
    });
  }

  function burst(x, y, n){
    if (reduced) return;
    var count = n || 14;
    for (var i = 0; i < count; i++){
      var ang = Math.random() * Math.PI * 2;
      var sp = 0.25 + Math.random() * 1.5;
      var c = COLORS[Math.floor(Math.random() * COLORS.length)];
      if (Math.random() < 0.42){
        parts.push({
          t: 'heart',
          x: x, y: y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.5,
          r: 3 + Math.random() * 4,
          a: 0.7,
          g: 0.0009,
          c: 'rgba(255,170,200,',
          rot: Math.random() * 6.28,
          vr: (Math.random() - 0.5) * 0.05,
          life: 0, max: 1400 + Math.random() * 900
        });
      } else {
        parts.push({
          t: 'dot',
          x: x, y: y,
          vx: Math.cos(ang) * sp,
          vy: Math.sin(ang) * sp - 0.4,
          r: 3 + Math.random() * 6,
          a: 0.65,
          c: c,
          life: 0, max: 900 + Math.random() * 900,
          wob: 0, ws: 0
        });
      }
    }
  }

  function rain(n){
    if (reduced) return;
    for (var i = 0; i < n; i++){
      (function(k){
        setTimeout(function(){
          if (parts.length > 260) return;
          parts.push({
            t: 'heart',
            x: Math.random() * W,
            y: -20 - Math.random() * 140,
            vx: (Math.random() - 0.5) * 0.4,
            vy: 0.28 + Math.random() * 0.55,
            g: 0.00025,
            r: 4 + Math.random() * 5,
            a: 0.28 + Math.random() * 0.34,
            c: 'rgba(255,170,200,',
            rot: Math.random() * 6.28,
            vr: (Math.random() - 0.5) * 0.05,
            life: 0, max: 9000,
            wob: Math.random() * 6.28,
            ws: 0.001 + Math.random() * 0.0016
          });
        }, k * 24 + Math.random() * 200);
      })(i);
    }
  }

  function heart(x, y, s, rot, alpha){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha;
    ctx.beginPath();
    ctx.moveTo(0, 4.2);
    ctx.bezierCurveTo(-5.2, 0.4, -6.2, -3.8, -3.1, -5.1);
    ctx.bezierCurveTo(-1.3, -5.8, -0.2, -4.6, 0, -3.2);
    ctx.bezierCurveTo(0.2, -4.6, 1.3, -5.8, 3.1, -5.1);
    ctx.bezierCurveTo(6.2, -3.8, 5.2, 0.4, 0, 4.2);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  var last = 0, acc = 0;

  function loop(ts){
    if (!last) last = ts;
    var dt = Math.min(60, ts - last);
    last = ts;

    ctx.clearRect(0, 0, W, H);

    if (!reduced){
      acc += dt;
      while (acc > 520){
        acc -= 520;
        if (parts.length < 64) ambient();
      }
    }

    for (var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.life += dt;
      var k = p.life / p.max;

      if (p.t === 'heart' || p.t === 'petal'){
        p.vy += (p.g || 0) * dt;
        p.x += p.vx * dt + Math.sin((p.life + p.wob * 900) * p.ws) * (p.t === 'petal' ? 0.35 : 0.12);
        p.y += p.vy * dt;
        p.rot += p.vr * dt / 16;
      } else {
        if (p.ws){
          p.x += Math.sin((p.life + p.wob * 500) * p.ws) * 0.45;
        } else {
          p.x += p.vx * dt;
        }
        p.y += p.vy * dt;
      }

      var alpha = p.a * (1 - Math.pow(Math.max(0, k - 0.55) / 0.45, 2));
      if (alpha < 0.01 || p.y < -60 || p.y > H + 80 || k >= 1){
        parts.splice(i, 1);
        continue;
      }

      if (p.t === 'heart'){
        ctx.fillStyle = p.c + '1)';
        heart(p.x, p.y, p.r / 3, p.rot, alpha);
      } else if (p.t === 'petal'){
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.globalAlpha = alpha;
        ctx.fillStyle = p.c + '1)';
        ctx.beginPath();
        ctx.ellipse(0, 0, p.r, p.r * 0.55, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      } else {
        var sz = p.r * 2.6;
        ctx.globalAlpha = alpha;
        ctx.drawImage(sprite, p.x - sz / 2, p.y - sz / 2, sz, sz);
      }
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);
  resize();
  requestAnimationFrame(loop);

  /* ---------- atajos para previsualizar (?i=2 o ?final=1) ---------- */
  try {
    var q = new URLSearchParams(window.location.search);
    if (q.has('i')){
      intro.classList.remove('on');
      journey.classList.add('on');
      dotbar(SCENES.length);
      state.locked = false;
      var idx = Math.max(0, Math.min(SCENES.length - 1, parseInt(q.get('i'), 10) || 0));
      paintDots(idx);
      render(SCENES[idx], idx);
      state.i = idx;
    } else if (q.has('final')){
      showFinale();
    }
  } catch (e){}

  function paintSound(){
    var s = soundBtn.querySelector('.slash');
    var w = soundBtn.querySelector('.waves');
    if (s) s.style.display = muted ? '' : 'none';
    if (w) w.style.display = muted ? 'none' : '';
  }

  paintSound();
})();
</script>
</body>
</html>
